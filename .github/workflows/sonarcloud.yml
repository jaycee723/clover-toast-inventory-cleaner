name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    # Only run if SONAR_TOKEN is configured in repository secrets
    if: "${{ secrets.SONAR_TOKEN != '' }}"
    runs-on: ubuntu-latest

    steps:
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=clover-toast-inventory-cleaner
            -Dsonar.sources=src,server.ts
            -Dsonar.tests=tests
          projectBaseDir: .
